# Default configuration for HyperFlowNet experiments
# Author: Shengning Wang

data:
  dataset: burgers_1d
  data_dir: data/raw
  n_train: 96
  n_test: 16
  grid: 256
  n_steps: 200
  nu: 0.02
  dt: 0.005
  channels: 1
  seed: 0

model:
  name: HyperFlowNet
  backbone: UWNO
  corrector: fno
  modes: 16
  width: 64
  depth: 4
  flow_steps: 8
  patch_size: 16
  heads: 4
  dim: 64
  refine_steps: 2

training:
  steps_stage1: 250
  steps_stage2: 250
  batch: 256
  lr: 1e-3
  bptt: 2
  objective: hyflow
  seed: 0
  checkpoint_dir: runs/exp

eval:
  rollout: 200
  metrics:
    - global_l2
    - shock_l2
    - tv_ratio
    - front_offset
    - shape_error
    - transport_error
    - spectrum_error

mechanism:
  sigmas: [0.25, 0.5, 1.0, 2.0, 4.0]
  n_samples: 8192
  n_grid: 256
